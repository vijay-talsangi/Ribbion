services:
  mysql:
    image: mysql:8.0
    container_name: ribbion-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ribbion_db
      MYSQL_USER: ribbion
      MYSQL_PASSWORD: ribbion123
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:
    driver: local
