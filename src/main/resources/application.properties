# Application
spring.application.name=ribbion

# Server
server.port=8080

# MySQL Datasource (Docker)
spring.datasource.url=jdbc:mysql://localhost:3306/ribbion_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=ribbion
spring.datasource.password=ribbion123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwt.secret=Ribbion2026SecretKeyForJWTAuthenticationMustBeLongEnoughForHS512Algorithm123456789
app.jwt.expiration-ms=86400000

# Jackson
spring.jackson.default-property-inclusion=non_null
